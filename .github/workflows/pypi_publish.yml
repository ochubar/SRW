name: PyPI Publish

on:
  release:
    types: [published]
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-n-publish:
    # pull requests are a duplicate of a branch push if within the same repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    name: ${{ matrix.host-os }} / Python ${{ matrix.python-version }} / OpenMP ${{ matrix.openmp }}
    runs-on: ${{ matrix.host-os }}
    strategy:
      fail-fast: false
      matrix:
        host-os: ["ubuntu-24.04", "macos-14", "windows-2022"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        openmp: ["off"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set OpenMP mode
        if: matrix.openmp == 'on'
        run: |
          export MODE="omp"
          echo "MODE=${MODE}" >> "$GITHUB_ENV"

      - name: Set MacOS Deployment Target
        if: runner.os == 'macOS'
        run: |
          export MACOSX_DEPLOYMENT_TARGET="10.15"
          echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}" >> "$GITHUB_ENV"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: testenv
          add-pip-as-python-dependency: true
          allow-softlinks: true
          auto-activate-base: false
          auto-update-conda: false
          channel-priority: flexible
          channels: conda-forge
          python-version: ${{ matrix.python-version }}
          show-channel-urls: true
          use-only-tar-bz2: false

      - name: Set up Visual Studio shell
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Ensure pip is available in conda env
        run: |
          set -vxeuo pipefail
          python -m pip --version || python -m ensurepip --default-pip || conda install -y -n testenv pip
          python -m pip --version

      - name: Verify environment
        run: |
          set -vxeuo pipefail
          which python
          python -V
          conda --version
          conda info
          python -m pip --version

      - name: Install build requirements with conda
        if: runner.os != 'Linux'
        run: |
          set -vxeuo pipefail
          conda install -y cmake

      - name: Install OpenMP for macOS with conda
        if: runner.os == 'macOS' && matrix.openmp == 'on'
        run: |
          set -vxeuo pipefail
          conda install -y -c conda-forge llvm-openmp

      - name: Install Python build tooling on Linux
        if: runner.os == 'Linux'
        run: |
          set -vxeuo pipefail
          python -m pip install --upgrade "pip<25"
          python -m pip install "cibuildwheel>=2.23,<4" "packaging==24.2" "setuptools<76"
          echo "CIBW_BEFORE_ALL=pip install cmake" >> "$GITHUB_ENV"
          PYTH_VER=${{ matrix.python-version }}
          PYTH_VER=${PYTH_VER//.}
          echo "CIBW_BUILD=cp${PYTH_VER}-*" >> "$GITHUB_ENV"

      - name: Install Python build tooling on Windows/Mac
        if: runner.os != 'Linux'
        run: |
          set -vxeuo pipefail
          python -m pip install --upgrade "pip<25"
          python -m pip install "packaging==24.2" "setuptools<76"

      - name: Build wheel on Linux
        if: runner.os == 'Linux'
        run: |
          set -vxeuo pipefail
          python -VV
          python -m cibuildwheel --output-dir dist env/python
          ls -la dist/*

      - name: Build wheel on Windows/Mac
        if: runner.os != 'Linux'
        run: |
          set -vxeuo pipefail
          cd env/python
          python -VV
          python setup.py bdist_wheel
          ls -la dist/*
          mkdir -p ../../dist
          cp dist/*.whl ../../dist/

      - name: Publish wheels to GitHub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: srwpy-${{ matrix.host-os }}-Py_${{ matrix.python-version }}-OpenMP_${{ matrix.openmp }}
          path: dist/*

      - name: Install the package and test requirements
        run: |
          set -vxeuo pipefail
          python -m pip install -v --find-links dist/ srwpy
          python -c "import srwpy; import srwpy.srwlpy"
          srw-viewer --help
          python -m pip install -r env/python/requirements-dev.txt
          python -m pip list

      - name: Run fast tests
        run: |
          set -vxeuo pipefail
          cd env/python
          pytest -k fast

  publish-to-pypi:
    if: github.event_name == 'release'
    name: Publish to PyPI
    needs: build-n-publish
    runs-on: ubuntu-24.04
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download wheels from GitHub artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist/
